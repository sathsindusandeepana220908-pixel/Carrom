plugins { id 'com.android.application' }

android {
    namespace 'com.carromroyale.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carromroyale.app'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
