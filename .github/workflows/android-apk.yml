name: Build Carrom Royale APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'game.js'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Copy latest web game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css game.js android/app/src/main/assets/

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: carrom-royale-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carrom-build-${{ github.run_number }}
          name: Carrom Royale APK build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
